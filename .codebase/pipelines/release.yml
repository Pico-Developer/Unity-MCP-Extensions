name: release-to-github
trigger: manual
inputs:
  version:
    type: string
    description: '目标版本 v{a.b.c} 或 a.b.c,例如 0.0.3 / v0.0.3。必传:不再从分支名或 package.json 推导,为空直接报错'
    required: true
    default: ''
  skip_version:
    type: boolean
    description: '跳过"新版本必须更大"校验(格式仍会校验)'
    required: false
    default: false
  tag:
    type: string
    description: 'tag 名,例如 release/v0.0.3;不填则不打 tag'
    required: false
    default: ''
  from_branch:
    type: string
    description: 'Codebase 源分支(单个),为空默认 main'
    required: false
    default: main
  to_branch:
    type: string
    description: 'GitHub 目标分支,可填多个用空格分隔,为空默认 main'
    required: false
    default: main
  skip_push:
    type: boolean
    description: '为 true 时只做本地处理(补版权头/改版本/提交),不推送到 GitHub'
    required: false
    default: false
jobs:
  release:
    name: Sync to GitHub main
    image: hub.byted.org/codebase/ci_debian_bullseye
    envs:
      VERSION: ${{ Event.Inputs.version }}
      SKIP_VERSION: ${{ Event.Inputs.skip_version }}
      TAG: ${{ Event.Inputs.tag }}
      FROM_BRANCH: ${{ Event.Inputs.from_branch }}
      TO_BRANCH: ${{ Event.Inputs.to_branch }}
      SKIP_PUSH: ${{ Event.Inputs.skip_push }}
      GITHUB_TOKEN: ${{ GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout
      - name: prepare-and-push
        commands:
          - apt-get update && apt-get install -y python3 git
          - git config user.name "pico-ci-bot"
          - git config user.email "pico-ci-bot@bytedance.com"
          # 关键:切分支前把 prepare_release.py 复制到 /tmp。
          # from_branch(如 release/vX.Y.Z)可能不含 .codebase/ 目录,checkout 后脚本会消失,
          # 导致 python3 .codebase/scripts/prepare_release.py 报 No such file or directory。
          - cp .codebase/scripts/prepare_release.py /tmp/prepare_release.py
          # 需求 0:从 from_branch(默认 main)切独立分支
          - git fetch origin "${FROM_BRANCH}"
          - git checkout -B "${FROM_BRANCH}" "origin/${FROM_BRANCH}"
          - git checkout -b "release/prep-$(date +%s)"
          # version 必传:不再从分支名或 package.json 推导,为空直接报错退出。
          # 与本地脚本 release_local.sh 一致——发布版本必须由调用方显式指定。
          - |
            RESOLVED_VERSION="${VERSION}"
            if [ -z "${RESOLVED_VERSION}" ]; then
              echo "ERROR: 未提供 version(必传)。请在触发流水线时显式填写目标版本号(如 0.0.3 / v0.0.3)" >&2
              exit 1
            fi
            export RESOLVED_VERSION
            echo "${RESOLVED_VERSION}" > /tmp/.resolved_version
          - export RESOLVED_VERSION="$(cat /tmp/.resolved_version)"
          # 需求 1+2+校验:补版权头 + 改版本 + 版本校验(用切分支前复制出的 /tmp 副本)
          - |
            if [ "${SKIP_VERSION}" = "true" ]; then
              python3 /tmp/prepare_release.py "${RESOLVED_VERSION}" --skip-version
            else
              python3 /tmp/prepare_release.py "${RESOLVED_VERSION}"
            fi
          - export REL_VERSION="$(cat .release_version)"
          - rm -f .release_version
          # 需求 3:确保 push 出去的 package.json version = 传入的版本号(显式强制写入)
          - |
            python3 - "${REL_VERSION}" <<'PY'
            import json, sys
            ver = sys.argv[1]
            with open("package.json", "r", encoding="utf-8") as f:
                pkg = json.load(f)
            if pkg.get("version") != ver:
                pkg["version"] = ver
                with open("package.json", "w", encoding="utf-8") as f:
                    json.dump(pkg, f, indent=2, ensure_ascii=False)
                    f.write("\n")
                print(f"[version] package.json 强制写入 version = {ver}")
            else:
                print(f"[version] package.json version 已是 {ver}")
            PY
          - git add -A
          - 'git commit -m "chore(release): headers & bump to ${REL_VERSION}" || echo "nothing to commit"'
          # 需求 5:skip_push=true 时只做本地处理,不推送到 GitHub
          - |
            if [ "${SKIP_PUSH}" = "true" ]; then
              echo "skip_push=true, 跳过推送到 GitHub(仅本地补版权头/改版本/提交)"
            else
              # 需求 1:push 前剥离内部目录 .codebase / .scripts 不进 GitHub。
              # 注意:git rm 传多个 pathspec 时是"原子"的——只要其中一个在索引里不存在,
              # 整条命令会失败且什么都不删,配合 "|| true" 被静默吞掉,曾导致 .codebase 泄漏。
              # 这里改成逐个独立剥离,并用 --ignore-unmatch 保证互不影响。
              STRIPPED=false
              for d in .codebase .scripts; do
                if git rm -r --cached --ignore-unmatch "$d" >/dev/null 2>&1; then
                  if [ -n "$(git status --porcelain -- "$d")" ]; then
                    echo "strip: removed $d from index"; STRIPPED=true
                  fi
                fi
              done
              if [ "$STRIPPED" = "true" ]; then
                git commit -m "chore(release): strip internal dirs before GitHub push" || true
              fi
              # 断言:确认内部目录确实不在待推送内容里,否则中止,避免泄漏到 GitHub
              for d in .codebase .scripts; do
                if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
                  echo "ERROR: $d still tracked, abort push to avoid leaking internal dirs" >&2
                  exit 1
                fi
              done
              # 需求 3:推送到 to_branch(默认 main,可多个用空格分隔)
              git remote remove github 2>/dev/null || true
              git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/Pico-Developer/Unity-MCP-Extensions.git"
              for b in ${TO_BRANCH}; do
                echo "pushing to github ${b}"
                git push github "HEAD:${b}"
              done
              # 需求 4:传了 tag 则打该名 tag 并推送,不传则跳过
              if [ -n "${TAG}" ]; then
                echo "pushing tag ${TAG}"
                git tag "${TAG}"
                git push github "${TAG}"
              else
                echo "no tag input, skip tagging"
              fi
            fi
